name: jobmatch
description: Professional job matching for Indonesia — free, personal use.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.8.3
  flutter_dotenv: ^5.2.1
  dio: ^5.7.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  intl: ^0.20.1
  file_picker: ^10.1.9
  url_launcher: ^6.3.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
